apiVersion: v1
kind: ConfigMap
metadata:
  name: user-web
data:
  index.html: |
    <!doctype html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>User Service</title>
      <style>
        body { font-family: Arial, sans-serif; background: #f3e8ff; margin: 0; }
        header { background: #7c3aed; color: white; padding: 28px; }
        main { margin: 35px auto; max-width: 760px; background: white; padding: 28px; border-radius: 12px; }
        .tag { display: inline-block; background: #ede9fe; padding: 8px 12px; border-radius: 8px; }
      </style>
    </head>
    <body>
      <header><h1>User Service</h1><p>E-commerce customer account</p></header>
      <main>
        <h2>Welcome, Customer!</h2>
        <p>This is the <strong>User</strong> application running on Kubernetes.</p>
        <p class="tag">Feature: Profile, address book, and account settings</p>
        <p>Demo endpoint: /user</p>
      </main>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-lb
  labels:
    app: user-lb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-lb
  template:
    metadata:
      labels:
        app: user-lb
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: web-content
          configMap:
            name: user-web
---
apiVersion: v1
kind: Service
metadata:
  name: user-lb-svc
spec:
  type: LoadBalancer
  selector:
    app: user-lb
  ports:
    - name: http
      port: 80
      targetPort: 80
---
