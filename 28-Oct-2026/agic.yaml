apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-path-config
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      location / {
        try_files $uri $uri/ /index.html;
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-web
data:
  index.html: |
    <!doctype html>
    <html><head><meta charset="utf-8"><title>User Service</title>
    <style>body{font-family:Arial;background:#f3e8ff;margin:0}header{background:#7c3aed;color:white;padding:28px}main{margin:35px auto;max-width:760px;background:white;padding:28px;border-radius:12px}</style>
    </head><body><header><h1>User Service</h1><p>Customer account</p></header>
    <main><h2>Welcome, Customer!</h2><p>Profile, address book, and account settings.</p><p>Ingress route: /user</p></main></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-app
  labels:
    app: user-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-app
  template:
    metadata:
      labels:
        app: user-app
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: web-content
          configMap:
            name: user-web
        - name: nginx-config
          configMap:
            name: nginx-path-config
---
apiVersion: v1
kind: Service
metadata:
  name: user-svc
spec:
  type: ClusterIP
  selector:
    app: user-app
  ports:
    - name: http
      port: 80
      targetPort: 80
---
